default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: tcc_development
  password: <%= ENV["POSTGRES_PASSWORD"] %>

test:
  <<: *default
  database: tcc_test
  password: <%= ENV["POSTGRES_PASSWORD"] %>

production:
  <<: *default
  database: tcc_production
  password: <%= ENV["POSTGRES_PASSWORD"] %>
